name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  grammar:
    name: Grammar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: src/ is in sync with grammar.js
        run: |
          npx tree-sitter generate
          git diff --exit-code -I'@generated by tree-sitter' -- src/

      - name: Corpus and node binding
        run: npm test

      - name: sample.fix parses cleanly
        run: npx tree-sitter parse -q sample.fix

  rust:
    name: Rust binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test

  python:
    name: Python binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e ".[core]"
      - run: python -m unittest discover -s bindings/python/tests -v
